# Local stack: frontend (Next.js), backend (Flask), MongoDB.
#   cp .env.example .env && docker compose up --build
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "5001:5001"
    environment:
      MONGO_URI: mongodb://mongo:27017/farmnest
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Optional integrations; empty values disable them.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.perplexity.ai}
      LLM_MODEL: ${LLM_MODEL:-sonar}
      SAGEMAKER_ENDPOINT: ${SAGEMAKER_ENDPOINT:-}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        # Used by the browser, so it must be reachable from the host machine.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    ports:
      - "3000:3000"
    environment:
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MONGODB_URI: mongodb://mongo:27017/farmnest
      BACKEND_URL: http://backend:5001
    depends_on:
      - backend

volumes:
  mongo_data:
